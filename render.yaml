services:
  - type: web
    name: campusmate-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python agent_student_twin.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: AGENT_SEED
        value: campusmate_student_twin_secret_seed_gcet_2026
