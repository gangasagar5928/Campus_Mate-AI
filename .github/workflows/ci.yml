name: CampusMate AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python AST & Syntax Compilation Check
        run: |
          python -m compileall -q .

      - name: Validate JSON Database Integrity
        run: |
          python -c "
          import json, os
          path_curr = 'data/curriculum.json' if os.path.exists('data/curriculum.json') else 'curriculum.json'
          path_bank = 'data/interview_bank.json' if os.path.exists('data/interview_bank.json') else 'interview_bank.json'
          with open(path_curr, 'r', encoding='utf-8') as f:
              c = json.load(f)
              assert 'branches' in c, 'branches missing in curriculum.json'
              assert 'ECE' in c['branches'] and 'CSE' in c['branches'], 'Core branches missing'
          with open(path_bank, 'r', encoding='utf-8') as f:
              b = json.load(f)
              assert 'companies' in b, 'companies missing in interview_bank.json'
              assert all(k in b['companies'] for k in ['qualcomm', 'amazon', 'tcs_prime', 'google', 'nvidia', 'microsoft']), 'Recruitment tracks missing'
          print('JSON Database Schemas: VALIDATED')
          "

      - name: Run Knowledge Retrieval Engine Test Suite
        run: |
          python tests/test_knowledge_engine.py

      - name: Run Syllabus & Balancer Test Suite
        run: |
          python tests/test_member2.py

      - name: Run Interviewer Test Suite
        run: |
          python tests/test_interviewer_suite.py

      - name: Run Complete Unit Test Suite Discovery
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Agent Module Smoke Test
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          import models
          import models.schemas
          import core.balancer
          import core.evaluator
          import core.knowledge_engine
          import ui.cards
          import agents.student_twin
          print('All Core Systems & Agent Modules: OPERATIONAL')
          "
